<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #171310; color: #F5EDE6;
           font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #E9A35B; } a:hover { color: #F2BC80; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #171310;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 18px; flex-shrink: 0;">
    <button style="background: transparent; border: none; color: #9C8E84; font-family: inherit; font-size: 16px; cursor: pointer; padding: 12px 0;">Cancel</button>
    <div style="font-size: 15.5px; font-weight: 500; color: #E8DAD0;">Edit alarm</div>
    <button style="background: transparent; border: none; color: #E9A35B; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; padding: 12px 0;">Save</button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; padding: 14px 0 22px;">
    <div style="display: flex; align-items: baseline; gap: 2px;">
      <span style="font-size: 76px; font-weight: 200; letter-spacing: 2px; font-variant-numeric: tabular-nums; line-height: 1;">06</span>
      <span style="font-size: 62px; font-weight: 200; color: #5A4C44; line-height: 1; padding: 0 3px;">:</span>
      <span style="font-size: 76px; font-weight: 200; letter-spacing: 2px; font-variant-numeric: tabular-nums; line-height: 1;">40</span>
    </div>
    <div style="display: flex; gap: 44px; margin-top: 10px;">
      <svg width="18" height="10" viewBox="0 0 18 10" fill="none" stroke="#4A3E37" stroke-width="1.6" stroke-linecap="round"><path d="M2 7l7-5 7 5"/></svg>
      <svg width="18" height="10" viewBox="0 0 18 10" fill="none" stroke="#4A3E37" stroke-width="1.6" stroke-linecap="round"><path d="M2 3l7 5 7-5"/></svg>
    </div>
  </div>

  <div style="display: flex; gap: 7px; justify-content: center; padding: 0 18px 22px;">
    <div style="width: 42px; height: 42px; border-radius: 21px; background: #E9A35B; color: #1B120A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">M</div>
    <div style="width: 42px; height: 42px; border-radius: 21px; background: #E9A35B; color: #1B120A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">T</div>
    <div style="width: 42px; height: 42px; border-radius: 21px; background: #E9A35B; color: #1B120A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">W</div>
    <div style="width: 42px; height: 42px; border-radius: 21px; background: #E9A35B; color: #1B120A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">T</div>
    <div style="width: 42px; height: 42px; border-radius: 21px; background: #E9A35B; color: #1B120A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">F</div>
    <div style="width: 42px; height: 42px; border-radius: 21px; background: #221B17; border: 1px solid #352C27; color: #7C6E66; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">S</div>
    <div style="width: 42px; height: 42px; border-radius: 21px; background: #221B17; border: 1px solid #352C27; color: #7C6E66; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">S</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 0 18px; overflow: hidden;">

    <div style="display: flex; align-items: center; min-height: 56px; padding: 0 16px; border-radius: 15px; background: #1E1815;">
      <span style="font-size: 15px; color: #9C8E84; width: 66px;">Label</span>
      <span style="font-size: 16px; color: #F5EDE6; flex-grow: 1;">Gym</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5A4C44" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
    </div>

    <div>
      <div style="font-size: 11.5px; letter-spacing: 1.3px; color: #7C6E66; text-transform: uppercase; margin-bottom: 10px; padding-left: 3px;">Sounds</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">

        <div style="padding: 15px 14px 14px; border-radius: 16px; background: #1B2422; border: 1px solid #2C3D3A;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <div style="width: 7px; height: 7px; border-radius: 4px; background: #5FB3AE;"></div>
            <span style="font-size: 12px; color: #79A5A1; font-weight: 500;">You'll hear</span>
          </div>
          <div style="font-size: 17px; color: #F5EDE6; margin-top: 9px; font-weight: 500;">Sunrise</div>
          <svg width="100%" height="20" viewBox="0 0 140 20" fill="none" style="margin-top: 9px;">
            <g fill="#3E5451">
              <rect x="0" y="8" width="2.5" height="4" rx="1.2"/><rect x="6" y="6" width="2.5" height="8" rx="1.2"/>
              <rect x="12" y="3" width="2.5" height="14" rx="1.2"/><rect x="18" y="7" width="2.5" height="6" rx="1.2"/>
              <rect x="24" y="5" width="2.5" height="10" rx="1.2"/><rect x="30" y="9" width="2.5" height="2" rx="1"/>
              <rect x="36" y="4" width="2.5" height="12" rx="1.2"/><rect x="42" y="7" width="2.5" height="6" rx="1.2"/>
              <rect x="48" y="2" width="2.5" height="16" rx="1.2"/><rect x="54" y="8" width="2.5" height="4" rx="1.2"/>
              <rect x="60" y="6" width="2.5" height="8" rx="1.2"/><rect x="66" y="9" width="2.5" height="2" rx="1"/>
              <rect x="72" y="5" width="2.5" height="10" rx="1.2"/><rect x="78" y="7" width="2.5" height="6" rx="1.2"/>
              <rect x="84" y="3" width="2.5" height="14" rx="1.2"/><rect x="90" y="8" width="2.5" height="4" rx="1.2"/>
            </g>
          </svg>
        </div>

        <div style="padding: 15px 14px 14px; border-radius: 16px; background: #2A211B; border: 1px solid #4A382A;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <div style="width: 7px; height: 7px; border-radius: 4px; background: #E9A35B;"></div>
            <span style="font-size: 12px; color: #C08B54; font-weight: 500;">Sam will hear</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; margin-top: 9px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E9A35B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 013 3v6a3 3 0 01-6 0V5a3 3 0 013-3z"/><path d="M19 10v1a7 7 0 01-14 0v-1"/><path d="M12 18v4"/></svg>
            <span style="font-size: 17px; color: #F5EDE6; font-weight: 500;">Your voice</span>
          </div>
          <svg width="100%" height="20" viewBox="0 0 140 20" fill="none" style="margin-top: 9px;">
            <g fill="#5E4630">
              <rect x="0" y="7" width="2.5" height="6" rx="1.2"/><rect x="6" y="4" width="2.5" height="12" rx="1.2"/>
              <rect x="12" y="8" width="2.5" height="4" rx="1.2"/><rect x="18" y="2" width="2.5" height="16" rx="1.2"/>
              <rect x="24" y="6" width="2.5" height="8" rx="1.2"/><rect x="30" y="5" width="2.5" height="10" rx="1.2"/>
              <rect x="36" y="9" width="2.5" height="2" rx="1"/><rect x="42" y="3" width="2.5" height="14" rx="1.2"/>
              <rect x="48" y="7" width="2.5" height="6" rx="1.2"/><rect x="54" y="5" width="2.5" height="10" rx="1.2"/>
              <rect x="60" y="8" width="2.5" height="4" rx="1.2"/><rect x="66" y="4" width="2.5" height="12" rx="1.2"/>
              <rect x="72" y="9" width="2.5" height="2" rx="1"/><rect x="78" y="6" width="2.5" height="8" rx="1.2"/>
              <rect x="84" y="7" width="2.5" height="6" rx="1.2"/><rect x="90" y="8" width="2.5" height="4" rx="1.2"/>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <div>
      <div style="font-size: 11.5px; letter-spacing: 1.3px; color: #7C6E66; text-transform: uppercase; margin-bottom: 10px; padding-left: 3px;">Who rings</div>
      <div style="display: flex; gap: 5px; padding: 5px; border-radius: 15px; background: #1E1815;">
        <div style="flex-grow: 1; height: 44px; border-radius: 11px; background: #342B25; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14.5px; font-weight: 600; color: #F5EDE6;">
          <svg width="17" height="13" viewBox="0 0 26 20" fill="none"><circle cx="8" cy="10" r="6.2" stroke="#E9A35B" stroke-width="1.6"/><circle cx="18" cy="10" r="6.2" stroke="#5FB3AE" stroke-width="1.6"/></svg>
          Both
        </div>
        <div style="flex-grow: 1; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 14.5px; color: #8A7C72;">Just me</div>
        <div style="flex-grow: 1; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 14.5px; color: #8A7C72;">Just Sam</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; min-height: 52px; padding: 0 16px; border-radius: 15px; background: #1E1815;">
        <span style="font-size: 15px; color: #C9BAAF; flex-grow: 1;">Snooze</span>
        <span style="font-size: 15px; color: #9C8E84;">9 min, up to 3&times;</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A4C44" stroke-width="1.8" stroke-linecap="round" style="margin-left: 8px;"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div style="display: flex; align-items: center; min-height: 52px; padding: 0 16px; border-radius: 15px; background: #1E1815;">
        <span style="font-size: 15px; color: #C9BAAF; flex-grow: 1;">To turn it off</span>
        <span style="font-size: 15px; color: #9C8E84;">Tap</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A4C44" stroke-width="1.8" stroke-linecap="round" style="margin-left: 8px;"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
