<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #141110; color: #F5EDE6;
           font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #E9A35B; } a:hover { color: #F2BC80; }
    @keyframes ringBreathe {
      0%, 100% { opacity: 0.30; transform: scale(1); }
      50%      { opacity: 0.62; transform: scale(1.045); }
    }
    @keyframes glowBreathe {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 0.95; }
    }
    .ring-outer { animation: ringBreathe 3.6s ease-in-out infinite; transform-origin: 140px 140px; }
    .ring-mid   { animation: ringBreathe 3.6s ease-in-out infinite 0.5s; transform-origin: 140px 140px; }
    .halo       { animation: glowBreathe 3.6s ease-in-out infinite; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #141110;">

  <div class="halo" style="position: absolute; top: 130px; left: 50%; margin-left: -230px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(circle, rgba(233,163,91,0.17) 0%, rgba(233,163,91,0.04) 45%, rgba(233,163,91,0) 70%);"></div>

  <div style="display: flex; justify-content: center; padding-top: 34px; position: relative;">
    <div style="display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 15px 0 12px; border-radius: 17px; background: rgba(42,33,27,0.85); border: 1px solid #3A2F27;">
      <svg width="26" height="18" viewBox="0 0 26 20" fill="none">
        <circle cx="8" cy="10" r="6.4" fill="#2A211B" stroke="#E9A35B" stroke-width="1.5"/>
        <circle cx="18" cy="10" r="6.4" fill="#1B2422" stroke="#5FB3AE" stroke-width="1.5"/>
      </svg>
      <span style="font-size: 13.5px; color: #C4B2A4;">Sam's phone is ringing too</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding-bottom: 20px;">

    <div style="position: relative; width: 280px; height: 280px; display: flex; align-items: center; justify-content: center;">
      <svg width="280" height="280" viewBox="0 0 280 280" fill="none" style="position: absolute; top: 0; left: 0;">
        <g class="ring-outer">
          <path d="M140 4 A136 136 0 0 1 140 276" stroke="#5FB3AE" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
          <path d="M140 276 A136 136 0 0 1 140 4" stroke="#E9A35B" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
        </g>
        <g class="ring-mid">
          <path d="M140 22 A118 118 0 0 1 140 258" stroke="#5FB3AE" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
          <path d="M140 258 A118 118 0 0 1 140 22" stroke="#E9A35B" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
        </g>
        <circle cx="140" cy="140" r="99" stroke="#2A231E" stroke-width="1.5"/>
        <path d="M140 41 A99 99 0 0 1 140 239" stroke="#5FB3AE" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M140 239 A99 99 0 0 1 140 41" stroke="#E9A35B" stroke-width="2.5" stroke-linecap="round"/>
      </svg>

      <div style="display: flex; flex-direction: column; align-items: center; position: relative;">
        <div style="font-size: 13px; letter-spacing: 2.4px; color: #A08C7C; text-transform: uppercase; margin-bottom: 12px;">Gym</div>
        <div style="font-size: 82px; font-weight: 200; letter-spacing: 3px; line-height: 1; font-variant-numeric: tabular-nums; color: #FBF5EF;">06:40</div>
        <div style="font-size: 14.5px; color: #8A7C72; margin-top: 12px;">Thursday, 6 March</div>
      </div>
    </div>
  </div>

  <div style="padding: 0 20px 8px; position: relative;">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <button style="height: 72px; border: 1px solid #3E332B; border-radius: 20px; background: #241D18; color: #F5EDE6; font-family: inherit; font-size: 18px; font-weight: 500; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C4B2A4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M5 3L2.5 5.5"/><path d="M19 3l2.5 2.5"/></svg>
        Snooze
      </button>
      <button style="height: 72px; border: none; border-radius: 20px; background: #E9A35B; color: #1B120A; font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1B120A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 5.5l-13 13"/><path d="M5.5 5.5l13 13"/></svg>
        Dismiss
      </button>
    </div>
    <div style="text-align: center; font-size: 13px; color: #6E625B; margin-top: 12px;">Stops your phone only</div>
  </div>

  <div style="margin: 18px 20px 0; padding-top: 16px; border-top: 1px solid #241D19; position: relative;">
    <div style="text-align: center; font-size: 11.5px; letter-spacing: 1.4px; color: #5F544D; text-transform: uppercase; margin-bottom: 12px;">For both of us</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button style="height: 46px; border: 1px solid #2E2621; border-radius: 14px; background: transparent; color: #8A7C72; font-family: inherit; font-size: 14.5px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;">
        <svg width="20" height="14" viewBox="0 0 26 20" fill="none"><circle cx="8" cy="10" r="6" stroke="#6E5A4A" stroke-width="1.4"/><circle cx="18" cy="10" r="6" stroke="#46605D" stroke-width="1.4"/></svg>
        Snooze both
      </button>
      <button style="height: 46px; border: 1px solid #2E2621; border-radius: 14px; background: transparent; color: #8A7C72; font-family: inherit; font-size: 14.5px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;">
        <svg width="20" height="14" viewBox="0 0 26 20" fill="none"><circle cx="8" cy="10" r="6" stroke="#6E5A4A" stroke-width="1.4"/><circle cx="18" cy="10" r="6" stroke="#46605D" stroke-width="1.4"/></svg>
        Dismiss both
      </button>
    </div>
    <div style="text-align: center; font-size: 12.5px; color: #544942; margin-top: 11px; padding-bottom: 26px;">Press and hold &mdash; this wakes or silences Sam too</div>
  </div>
</div>
</x-dc>
</body>
</html>
