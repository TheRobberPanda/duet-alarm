<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #171310; color: #F5EDE6;
           font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #E9A35B; } a:hover { color: #F2BC80; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #171310;">

  <div style="position: absolute; top: 120px; left: 50%; margin-left: -190px; width: 380px; height: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(95,179,174,0.13) 0%, rgba(95,179,174,0) 68%);"></div>

  <div style="display: flex; align-items: center; height: 56px; padding: 0 8px; position: relative;">
    <button style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B2A398" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>

  <div style="padding: 8px 28px 0; position: relative;">
    <h1 style="font-family: 'Instrument Serif', Georgia, serif; font-size: 38px; font-weight: 400; line-height: 1.1; margin: 0; letter-spacing: -0.3px;">Invite your person.</h1>
    <p style="font-size: 16px; line-height: 1.5; color: #B2A398; margin: 12px 0 0; text-wrap: pretty;">Send them this code. Once they enter it, your alarms are shared.</p>
  </div>

  <div style="margin: 30px 20px 0; padding: 28px 20px 24px; border-radius: 24px; background: linear-gradient(180deg, #241D19 0%, #1D1714 100%); border: 1px solid #352C27; position: relative;">
    <div style="position: absolute; top: -1px; left: 40px; right: 40px; height: 1px; background: linear-gradient(90deg, rgba(233,163,91,0) 0%, #E9A35B 35%, #5FB3AE 65%, rgba(95,179,174,0) 100%);"></div>

    <div style="font-size: 11px; letter-spacing: 1.6px; color: #7C6E66; text-align: center; text-transform: uppercase; margin-bottom: 18px;">Your invite code</div>

    <div style="display: flex; gap: 8px; justify-content: center;">
      <div style="width: 46px; height: 60px; border-radius: 12px; background: #171310; border: 1px solid #3B302A; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 400; font-variant-numeric: tabular-nums; color: #F5EDE6;">K</div>
      <div style="width: 46px; height: 60px; border-radius: 12px; background: #171310; border: 1px solid #3B302A; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 400; font-variant-numeric: tabular-nums; color: #F5EDE6;">7</div>
      <div style="width: 46px; height: 60px; border-radius: 12px; background: #171310; border: 1px solid #3B302A; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 400; font-variant-numeric: tabular-nums; color: #F5EDE6;">M</div>
      <div style="width: 46px; height: 60px; border-radius: 12px; background: #171310; border: 1px solid #3B302A; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 400; font-variant-numeric: tabular-nums; color: #F5EDE6;">4</div>
      <div style="width: 46px; height: 60px; border-radius: 12px; background: #171310; border: 1px solid #3B302A; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 400; font-variant-numeric: tabular-nums; color: #F5EDE6;">R</div>
      <div style="width: 46px; height: 60px; border-radius: 12px; background: #171310; border: 1px solid #3B302A; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 400; font-variant-numeric: tabular-nums; color: #F5EDE6;">2</div>
    </div>

    <div style="text-align: center; font-size: 13px; color: #7C6E66; margin-top: 14px;">Expires in 24 hours</div>

    <button style="width: 100%; height: 52px; margin-top: 20px; border: none; border-radius: 15px; background: #E9A35B; color: #1B120A; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B120A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>
      Share code
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; margin: 24px 40px 0;">
    <div style="flex-grow: 1; height: 1px; background: #2E2621;"></div>
    <div style="font-size: 13px; color: #7C6E66;">or</div>
    <div style="flex-grow: 1; height: 1px; background: #2E2621;"></div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; margin-top: 22px;">
    <div style="width: 124px; height: 124px; border-radius: 18px; background: #F5EDE6; padding: 11px; display: flex; align-items: center; justify-content: center;">
      <svg width="102" height="102" viewBox="0 0 21 21" shape-rendering="crispEdges">
        <rect width="21" height="21" fill="#F5EDE6"/>
        <g fill="#171310">
          <rect x="0" y="0" width="7" height="1"/><rect x="0" y="6" width="7" height="1"/>
          <rect x="0" y="0" width="1" height="7"/><rect x="6" y="0" width="1" height="7"/>
          <rect x="2" y="2" width="3" height="3"/>
          <rect x="14" y="0" width="7" height="1"/><rect x="14" y="6" width="7" height="1"/>
          <rect x="14" y="0" width="1" height="7"/><rect x="20" y="0" width="1" height="7"/>
          <rect x="16" y="2" width="3" height="3"/>
          <rect x="0" y="14" width="7" height="1"/><rect x="0" y="20" width="7" height="1"/>
          <rect x="0" y="14" width="1" height="7"/><rect x="6" y="14" width="1" height="7"/>
          <rect x="2" y="16" width="3" height="3"/>
          <rect x="9" y="1" width="1" height="2"/><rect x="11" y="0" width="1" height="4"/>
          <rect x="9" y="5" width="3" height="1"/><rect x="8" y="8" width="1" height="1"/>
          <rect x="10" y="8" width="2" height="1"/><rect x="13" y="8" width="1" height="1"/>
          <rect x="16" y="9" width="1" height="2"/><rect x="18" y="8" width="2" height="1"/>
          <rect x="8" y="10" width="2" height="1"/><rect x="11" y="10" width="1" height="2"/>
          <rect x="14" y="11" width="2" height="1"/><rect x="18" y="11" width="1" height="2"/>
          <rect x="9" y="13" width="1" height="2"/><rect x="12" y="13" width="2" height="1"/>
          <rect x="16" y="14" width="1" height="1"/><rect x="19" y="14" width="1" height="2"/>
          <rect x="9" y="16" width="2" height="1"/><rect x="12" y="16" width="1" height="3"/>
          <rect x="15" y="17" width="2" height="1"/><rect x="18" y="18" width="2" height="1"/>
          <rect x="9" y="19" width="1" height="2"/><rect x="14" y="19" width="3" height="1"/>
          <rect x="11" y="8" width="1" height="1"/>
        </g>
      </svg>
    </div>
    <div style="font-size: 13.5px; color: #7C6E66; margin-top: 12px;">Let them scan this instead</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <button style="height: 52px; margin: 0 24px 32px; border: 1px solid #352C27; border-radius: 15px; background: transparent; color: #C9BAAF; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer;">Enter their code instead</button>
</div>
</x-dc>
</body>
</html>
