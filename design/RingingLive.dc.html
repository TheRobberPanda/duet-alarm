<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #141110; color: #F5EDE6;
           font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #E9A35B; } a:hover { color: #F2BC80; }
    @keyframes ringBreathe {
      0%, 100% { opacity: 0.30; transform: scale(1); }
      50%      { opacity: 0.60; transform: scale(1.04); }
    }
    @keyframes softBlink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }
    .ring-outer { animation: ringBreathe 3.6s ease-in-out infinite; transform-origin: 115px 115px; }
    .live-dot   { animation: softBlink 1.8s ease-in-out infinite; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #141110;">

  <div style="position: absolute; top: 150px; left: 50%; margin-left: -210px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(95,179,174,0.13) 0%, rgba(95,179,174,0) 68%);"></div>

  <div style="display: flex; justify-content: center; padding-top: 34px; position: relative;">
    <div style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 15px; border-radius: 17px; background: rgba(27,36,34,0.9); border: 1px solid #2C3D3A;">
      <div class="live-dot" style="width: 7px; height: 7px; border-radius: 4px; background: #5FB3AE;"></div>
      <span style="font-size: 13.5px; color: #79A5A1;">You're still ringing</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 26px 0 6px; position: relative;">
    <div style="position: relative; width: 230px; height: 230px; display: flex; align-items: center; justify-content: center;">
      <svg width="230" height="230" viewBox="0 0 230 230" fill="none" style="position: absolute; top: 0; left: 0;">
        <g class="ring-outer">
          <path d="M115 6 A109 109 0 0 1 115 224" stroke="#5FB3AE" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
        </g>
        <circle cx="115" cy="115" r="88" stroke="#2A231E" stroke-width="1.5"/>
        <path d="M115 27 A88 88 0 0 1 115 203" stroke="#5FB3AE" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M115 203 A88 88 0 0 1 115 27" stroke="#4A3B2E" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 7"/>
      </svg>
      <div style="display: flex; flex-direction: column; align-items: center; position: relative;">
        <div style="font-size: 12px; letter-spacing: 2.2px; color: #A08C7C; text-transform: uppercase; margin-bottom: 10px;">Gym</div>
        <div style="font-size: 66px; font-weight: 200; letter-spacing: 2.5px; line-height: 1; font-variant-numeric: tabular-nums; color: #FBF5EF;">06:43</div>
      </div>
    </div>
  </div>

  <div style="margin: 4px 20px 0; padding: 18px 18px 16px; border-radius: 20px; background: linear-gradient(150deg, #2B211A 0%, #1F1815 100%); border: 1px solid #46362A; position: relative;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="position: relative; width: 46px; height: 46px; flex-shrink: 0;">
        <svg width="46" height="46" viewBox="0 0 46 46" fill="none" style="position: absolute; top: 0; left: 0;">
          <circle cx="23" cy="23" r="21" stroke="#3A2E24" stroke-width="2.5"/>
          <path d="M23 2 A21 21 0 0 1 40.6 33.5" stroke="#E9A35B" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #E9A35B;">S</div>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-size: 17px; color: #F5EDE6; font-weight: 500;">Sam snoozed</div>
        <div style="font-size: 13.5px; color: #A08C7C; margin-top: 3px;">Back in a few minutes</div>
      </div>
      <div style="text-align: right; flex-shrink: 0;">
        <div style="font-size: 26px; font-weight: 300; color: #E9A35B; font-variant-numeric: tabular-nums; letter-spacing: 0.5px;">4:51</div>
      </div>
    </div>
    <div style="height: 4px; border-radius: 2px; background: #34291F; margin-top: 15px; overflow: hidden;">
      <div style="width: 46%; height: 4px; border-radius: 2px; background: #E9A35B;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 8px;">
      <span style="font-size: 12px; color: #6E5F53;">Snooze 1 of 3</span>
      <span style="font-size: 12px; color: #6E5F53;">Rings again 06:48</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 8px; position: relative;">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <button style="height: 72px; border: 1px solid #3E332B; border-radius: 20px; background: #241D18; color: #F5EDE6; font-family: inherit; font-size: 18px; font-weight: 500; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C4B2A4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M5 3L2.5 5.5"/><path d="M19 3l2.5 2.5"/></svg>
        Snooze
      </button>
      <button style="height: 72px; border: none; border-radius: 20px; background: #E9A35B; color: #1B120A; font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1B120A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 5.5l-13 13"/><path d="M5.5 5.5l13 13"/></svg>
        Dismiss
      </button>
    </div>
    <div style="text-align: center; font-size: 13px; color: #6E625B; margin-top: 12px;">Stops your phone only</div>
  </div>

  <div style="margin: 18px 20px 0; padding-top: 16px; border-top: 1px solid #241D19; position: relative;">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button style="height: 46px; border: 1px solid #2E2621; border-radius: 14px; background: transparent; color: #8A7C72; font-family: inherit; font-size: 14.5px; font-weight: 500; cursor: pointer;">Wake Sam now</button>
      <button style="height: 46px; border: 1px solid #2E2621; border-radius: 14px; background: transparent; color: #8A7C72; font-family: inherit; font-size: 14.5px; font-weight: 500; cursor: pointer;">Dismiss both</button>
    </div>
    <div style="text-align: center; font-size: 12.5px; color: #544942; margin-top: 11px; padding-bottom: 26px;">Press and hold</div>
  </div>
</div>
</x-dc>
</body>
</html>
